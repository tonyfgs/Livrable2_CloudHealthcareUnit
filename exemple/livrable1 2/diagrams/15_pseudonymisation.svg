<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="446px" preserveAspectRatio="none" style="width:698px;height:446px;background:#FFFFFF;" version="1.1" viewBox="0 0 698 446" width="698px" zoomAndPan="magnify"><title>Pseudonymisation et minimisation : fronti&#232;re de la zone identifiante</title><defs/><g><g class="title" data-source-line="5"><text fill="#1F2937" font-family="Lato" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="451.1212" x="116.4723" y="26.8049">Pseudonymisation et minimisation : fronti&#232;re de la zone identifiante</text></g><!--cluster Z2--><g class="cluster" data-entity="Z2" data-source-line="6" data-uid="ent0002" id="cluster_Z2"><rect fill="#FCFCFD" height="140" rx="4" ry="4" style="stroke:#9CA3AF;stroke-width:1;stroke-dasharray:7,7;" width="516" x="24" y="49.9998"/><text fill="#374151" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="413.29" x="75.355" y="66.8309">Z2 &#183; zone identifiante : HDFS chu/bronze, aucun acc&#232;s humain nominatif</text></g><!--cluster Z3--><g class="cluster" data-entity="Z3" data-source-line="11" data-uid="ent0006" id="cluster_Z3"><rect fill="#FCFCFD" height="140" rx="4" ry="4" style="stroke:#9CA3AF;stroke-width:1;stroke-dasharray:7,7;" width="443" x="7" y="213.9998"/><text fill="#374151" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="318.2989" x="69.3506" y="230.8309">Z3 &#183; zone pseudonymis&#233;e : HDFS chu/silver et chu/gold</text></g><!--entity B--><g class="entity" data-entity="B" data-source-line="7" data-uid="ent0003" id="entity_B"><rect fill="#F6E3D0" height="70.8" rx="4" ry="4" style="stroke:#A0612B;stroke-width:0.5;" width="184.4332" x="40" y="95.4998"/><text fill="#1F2937" font-family="Lato" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.955" x="52" y="120.3309">Bronze S1</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="139.9387" x="52" y="135.9309">Id_patient, nom, n&#176; s&#233;cu,</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="160.4332" x="52" y="151.5309">adresse, date de naissance&#8230;</text></g><!--entity J--><g class="entity" data-entity="J" data-source-line="8" data-uid="ent0004" id="entity_J"><rect fill="#ECEFF3" height="86.4001" rx="4" ry="4" style="stroke:#6B7785;stroke-width:0.5;" width="282.8758" x="240.5" y="87.9998"/><text fill="#1F2937" font-family="Lato" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="160.6736" x="252.5" y="112.8309">Job Talend J_SLV_PATIENT</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="242.8207" x="252.5" y="128.4309">tJavaRow : normalise &#171; CHU|PATIENT|id &#187;,</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="196.1702" x="252.5" y="144.0309">HMAC-SHA-256 (routine) ; tMap :</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="258.8758" x="252.5" y="159.6309">supprime les identifiants ; CP &#8594; d&#233;partement</text></g><!--entity S--><g class="entity" data-entity="S" data-source-line="12" data-uid="ent0007" id="entity_S"><rect fill="#ECEFF3" height="86.4001" rx="4" ry="4" style="stroke:#6B7785;stroke-width:0.5;" width="197.1732" x="23.5" y="251.9998"/><text fill="#1F2937" font-family="Lato" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="32.318" x="35.5" y="276.8309">Silver</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="61.6786" x="71.146" y="276.8309">slv_patient</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="123.0126" x="35.5" y="292.4309">patient_pseudo, sexe,</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="158.5157" x="35.5" y="308.0309">d&#233;partement, version de cl&#233;</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="173.1732" x="35.5" y="323.6309">(date de naissance : restreinte)</text></g><!--entity G--><g class="entity" data-entity="G" data-source-line="13" data-uid="ent0008" id="entity_G"><rect fill="#FFF4CC" height="86.4001" rx="4" ry="4" style="stroke:#B8901A;stroke-width:0.5;" width="197.3552" x="236.5" y="251.9998"/><text fill="#1F2937" font-family="Lato" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="27.5145" x="248.5" y="276.8309">Gold</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="105.9891" x="279.3425" y="276.8309">dim_patient + faits</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="119.5546" x="248.5" y="292.4309">&#226;ge &#224; l'acte, tranche ;</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="173.3552" x="248.5" y="308.0309">ni date de naissance ni pseudo</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="124.0916" x="248.5" y="323.6309">expos&#233;s aux profils BI</text></g><!--entity K--><g class="entity" data-entity="K" data-source-line="10" data-uid="ent0005" id="entity_K"><rect fill="#FBE5E3" height="70.8" rx="4" ry="4" style="stroke:#B03A2E;stroke-width:0.5;" width="226.0657" x="466" y="259.4998"/><text fill="#1F2937" font-family="Lato" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="159.8416" x="478" y="284.3309">Fichier de contexte prot&#233;g&#233;</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="180.1802" x="478" y="299.9309">(hors Git ; coffre en production)</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="202.0657" x="478" y="315.5309">cl&#233; HMAC par domaine, versionn&#233;e</text></g><!--entity V--><g class="entity" data-entity="V" data-source-line="15" data-uid="ent0009" id="entity_V"><rect fill="#E7F5EC" height="70.8" rx="4" ry="4" style="stroke:#2E7D4F;stroke-width:0.5;" width="178.0177" x="246" y="369.9998"/><text fill="#1F2937" font-family="Lato" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="74.7045" x="258" y="394.8309">Vues v_ind_*</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="23.166" x="336.0325" y="394.8309">(C1)</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="154.0177" x="258" y="410.4309">seuil : 11 patients distincts,</text><text fill="#1F2937" font-family="Lato" font-size="13" lengthAdjust="spacing" textLength="122.5056" x="258" y="426.0309">masquage secondaire</text></g><!--link B to J--><g class="link" data-entity-1="B" data-entity-2="J" data-source-line="16" data-uid="lnk10" id="link_B_J"><path d="M224.03,130.9998 C229.32,130.9998 228.69,130.9998 234.11,130.9998" fill="none" id="B-to-J" style="stroke:#374151;stroke-width:1.2;"/><polygon fill="#374151" points="240.11,130.9998,231.11,126.9998,235.11,130.9998,231.11,134.9998,240.11,130.9998" style="stroke:#374151;stroke-width:1.2;"/></g><!--reverse link J to K--><g class="link" data-entity-1="J" data-entity-2="K" data-source-line="17" data-uid="lnk12" id="link_J_K"><path d="M494.75,180.0898 C494.75,206.6598 494.75,234.3298 494.75,259.3898" fill="none" id="J-backto-K" style="stroke:#374151;stroke-width:1.2;stroke-dasharray:7,7;"/><polygon fill="#374151" points="494.75,174.0898,490.75,183.0898,494.75,179.0898,498.75,183.0898,494.75,174.0898" style="stroke:#374151;stroke-width:1.2;"/><text fill="#374151" font-family="Lato" font-size="11" lengthAdjust="spacing" textLength="66.353" x="520.6963" y="185.597">tContextLoad</text><text fill="#374151" font-family="Lato" font-size="11" lengthAdjust="spacing" textLength="79.9437" x="513.901" y="198.7972">(variable de type</text><text fill="#374151" font-family="Lato" font-size="11" lengthAdjust="spacing" textLength="112.2456" x="497.75" y="211.9974">Password, en m&#233;moire)</text></g><!--link J to S--><g class="link" data-entity-1="J" data-entity-2="S" data-source-line="18" data-uid="lnk13" id="link_J_S"><path d="M240.3,170.9998 C183.06,170.9998 130.25,170.9998 130.25,170.9998 C130.25,170.9998 130.25,210.1598 130.25,245.9798" fill="none" id="J-to-S" style="stroke:#374151;stroke-width:1.2;"/><polygon fill="#374151" points="130.25,251.9798,134.25,242.9798,130.25,246.9798,126.25,242.9798,130.25,251.9798" style="stroke:#374151;stroke-width:1.2;"/><text fill="#374151" font-family="Lato" font-size="11" lengthAdjust="spacing" textLength="55.3198" x="86.79" y="184.857">seule sortie</text><text fill="#374151" font-family="Lato" font-size="11" lengthAdjust="spacing" textLength="27.7864" x="100.5567" y="198.0572">de Z2</text></g><!--link S to G--><g class="link" data-entity-1="S" data-entity-2="G" data-source-line="19" data-uid="lnk14" id="link_S_G"><path d="M220.71,294.9998 C225.93,294.9998 225.18,294.9998 230.4,294.9998" fill="none" id="S-to-G" style="stroke:#374151;stroke-width:1.2;"/><polygon fill="#374151" points="236.4,294.9998,227.4,290.9998,231.4,294.9998,227.4,298.9998,236.4,294.9998" style="stroke:#374151;stroke-width:1.2;"/></g><!--link G to V--><g class="link" data-entity-1="G" data-entity-2="V" data-source-line="20" data-uid="lnk15" id="link_G_V"><path d="M335,338.0398 C335,348.5798 335,353.7498 335,363.8998" fill="none" id="G-to-V" style="stroke:#374151;stroke-width:1.2;"/><polygon fill="#374151" points="335,369.8998,339,360.8998,335,364.8998,331,360.8998,335,369.8998" style="stroke:#374151;stroke-width:1.2;"/></g><!--SRC=[VPJDJjj058NtVefRDeKsWGPK5e0YGTe60bIeeIoGfMZYkKb6s3Fkp3W4IgMk-W1zWggBYgYRxhhe3hy9Jz9Zcv-qLDrOzdZcdk-UU-n7IaTn9fcSFukv9smqKeigI-B0dIYT2YiIYfLcVvOo6Uj7PkQ5Df8TfzHOdLcqGfyKYolF0gzyp7JWE9D6doNA2Q-C9lQKAAtkdjTeO8tsAh-qJ4291PqRpQGaOtMWXFOSM8wyq4FKcpjU