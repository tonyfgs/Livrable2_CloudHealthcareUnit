# Trino 484 - configuration noeud unique (coordinator+worker sur le meme conteneur).
# Plafond memoire VOLONTAIREMENT bas : la VM Docker Desktop fait ~7,6 Go et
# partagee avec Spark (worker 4 Go), Hive (metastore + HS2), MinIO, Airflow...
# Sans plafond, le launcher Trino prend ~80 % de la RAM visible (~6 Go) et le
# conteneur se fait OOM-killer (exit 137) pendant les gros jobs Spark.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Plafonds de memoire par requete (donnees du projet : ~1-2 Go utiles)
query.max-memory-per-node=512MB
query.max-memory=1GB
query.max-total-memory=1500MB
memory.heap-headroom-per-node=256MB
query.max-execution-time=30m
query.max-planning-time=10m
