# ============================================================================
# Livrable 2 - CHU - Trino : connecteur Hive (catalogue `hive`)
# ----------------------------------------------------------------------------
# Trino lit les tables du schéma en étoile déclarées dans le Hive Metastore
# (DDL : 01_ddl/01_schema_gold_hive.sql) et les données Parquet partitionnées
# stockées dans MinIO. Le connecteur Hive de Trino :
#   - exploite les colonnes de partition pour le PRUNING (filtres sur
#     annee / sexe / tranche_age / region) ;
#   - exploite les statistiques Parquet (min/max par colonne) pour le pruning
#     intra-fichier ;
#   - le bucketing Hive n'est PAS utilisé ici : Trino 484 refuse les tables
#     bucketées écrites par Spark (nombre de fichiers != buckets déclarés).
# ============================================================================
connector.name=hive

# Catalogue : Hive Metastore (service hive-metastore)
hive.metastore.uri=thrift://hive-metastore:9083
hive.metastore.thrift.client.max-retries=3

# Stockage : data lake MinIO (API S3 compatible).
# Depuis Trino 460+, l'ancien filesystem S3A legacy (hive.s3.*) est supprimé :
# le connecteur Hive utilise le filesystem S3 NATIF de Trino, activé par
# fs.s3.enabled=true et configuré via les propriétés s3.* ci-dessous
# (voir https://trino.io/docs/current/object-storage/file-system-s3.html).
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
s3.path-style-access=true
s3.region=us-east-1

# Lecture Parquet : par NOM de colonne (et non par position)
hive.parquet.use-column-names=true

# Tables externes : Trino ne déplace ni ne supprime jamais les données
# (les tables non gérées par Hive sont en lecture seule par défaut)
hive.non-managed-table-writes-enabled=false

# Cache du metastore (rafraîchi périodiquement ; les chargements Spark
# incrémentaux sont pris en compte au TTL près)
hive.metastore-cache-ttl=0s
hive.metastore-refresh-interval=1m

# Dossiers récursifs (partitionnement dynamique Spark)
hive.recursive-directories=true
