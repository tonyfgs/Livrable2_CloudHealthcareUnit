# ============================================================================
# Livrable 2 - CHU - Spark : configuration commune (master + workers)
# ----------------------------------------------------------------------------
# Utilisée pour les soumissions manuelles (spark-submit) ; le DAG Airflow
# transmet les mêmes paramètres via SparkSubmitOperator (conf + packages).
# ============================================================================

# Cluster standalone (services spark-master / spark-worker)
spark.master                     spark://spark-master:7077

# Catalogue : Hive Metastore (Spark publie les définitions de tables)
spark.sql.catalogImplementation  hive
spark.hive.metastore.uris         thrift://hive-metastore:9083
spark.sql.warehouse.dir           s3a://lake/warehouse

# Stockage : data lake MinIO (connecteur S3A)
spark.hadoop.fs.s3a.endpoint                 http://minio:9000
spark.hadoop.fs.s3a.access.key               minioadmin
spark.hadoop.fs.s3a.secret.key               minioadmin
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.connection.ssl.enabled   false
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# Jars externes (driver JDBC PostgreSQL pour S1 + S3A côté workers)
spark.jars.packages              org.postgresql:postgresql:42.7.3,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262

# Format de sortie : Parquet compressé (zstd) + statistiques pour le pruning
spark.sql.parquet.compression.codec          zstd
spark.sql.parquet.writeLegacyFormat          false

# Bucketing Hive (co-localisation des jointures) + tri
spark.sql.sources.bucketing.enabled          true
spark.sql.sources.bucketing.maxBuckets       1000

# Optimiseur
spark.sql.adaptive.enabled                   true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.files.maxRecordsPerFile            5000000
