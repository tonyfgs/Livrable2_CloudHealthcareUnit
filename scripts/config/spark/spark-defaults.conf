# ============================================================================
# Livrable 2 - CHU - Spark : configuration commune (master + workers)
# ----------------------------------------------------------------------------
# Utilisée pour les soumissions manuelles (spark-submit) ; le DAG Airflow
# transmet les mêmes paramètres via SparkSubmitOperator (conf + packages).
# ============================================================================

# Cluster standalone (services spark-master / spark-worker)
spark.master                     spark://spark-master:7077

# Catalogue IN-MEMORY côté Spark : le client Hive 2.3 de Spark 3.5.1 est
# incompatible du Hive Metastore 4.x (Invalid method name: get_table).
# Spark écrit les Parquet dans le lake ; le metastore est rafraîchi par le DAG
# (tâche msck_repair_metastore, MSCK REPAIR TABLE via beeline).
spark.sql.catalogImplementation  in-memory
spark.sql.warehouse.dir           s3a://lake/warehouse

# Python des workers = Python 3.12 embarqué dans l'image chu-spark (le driver
# Airflow tourne en 3.12 ; PySpark exige la même version mineure partout)
spark.pyspark.python               /opt/python3.12/bin/python3.12
# Driver = conteneur Airflow (spark-submit manuel depuis chu-airflow-scheduler,
# son python3 = 3.12) ; ne PAS pointer vers /opt/python3.12 ici, ce chemin
# n'existe que dans l'image chu-spark (workers)
spark.pyspark.driver.python        python3

# Stockage : data lake MinIO (connecteur S3A)
spark.hadoop.fs.s3a.endpoint                 http://minio:9000
spark.hadoop.fs.s3a.access.key               minioadmin
spark.hadoop.fs.s3a.secret.key               minioadmin
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.connection.ssl.enabled   false
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# Jars S3A/JDBC : déjà posés dans $SPARK_HOME/jars au BUILD de l'image
# chu-spark (config/spark/Dockerfile) -> PAS de spark.jars.packages ici
# (sinon Ivy stream 280 Mo de jars driver -> workers à chaque soumission)

# Format de sortie : Parquet compressé (zstd) + statistiques pour le pruning
spark.sql.parquet.compression.codec          zstd
spark.sql.parquet.writeLegacyFormat          false

# Optimiseur
spark.sql.adaptive.enabled                   true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.files.maxRecordsPerFile            5000000
