# ============================================================================
# Livrable 2 - Cloud Healthcare Unit (CHU) - Plateforme data (Docker Compose)
# ----------------------------------------------------------------------------
# Stack imposée, positionnée par couche :
#
#   INGESTION      minio-init         : copie des sources brutes (DATA Projet)
#                                       dans le data lake MinIO (zone raw)
#   STOCKAGE       minio (+ minio-init): data lake S3 (bucket `lake`,
#                                       préfixes raw/ silver/ gold/ warehouse/)
#   CATALOGUE      metastore-db +       : Hive Metastore (métadonnées des tables
#                   hive-metastore +       externes Parquet partitionnées/bucketées)
#                   hive-hs2             : HiveServer2 (beeline/JDBC, DDL du DAG)
#   TRAITEMENT     spark-master +       : Apache Spark (ETL/ELT : S1 PostgreSQL
#                   spark-worker          via JDBC, CSV du lake, écriture Gold)
#   ORCHESTRATION  airflow-init +       : Apache Airflow (DAGs lakehouse_init /
#                   airflow-scheduler +    lakehouse_daily, SparkSubmitOperator)
#                   airflow-webserver
#   REQUÊTAGE      trino               : Trino (lecture distribuée du lake via
#                                       le connecteur Hive, pruning partitions)
#   VISUALISATION  superset (+ superset-db) : Apache Superset (localhost:8088)
#   SOURCES        s1-postgres         : S1 PostgreSQL (dump ChuSimulation)
#                   bench-duckdb        : conteneur PoC/benchmark (DuckDB) +
#                                       contrôles qualité (dq_checks.sql)
#
# Démarrage :  docker compose up -d
# Arrêt :      docker compose down        (ajouter -v pour purger les volumes)
#
# URLs :  Superset http://localhost:8088   Trino http://localhost:8080
#         MinIO  http://localhost:9001    Airflow http://localhost:8090
# ============================================================================
name: chu-l2

networks:
  chu-net:
    driver: bridge

volumes:
  minio-data:
  metastore-db-data:
  superset-db-data:
  airflow-db-data:
  s1-data:
  airflow-logs:

services:

  # --------------------------------------------------------------------------
  # STOCKAGE : data lake MinIO (S3)
  # --------------------------------------------------------------------------
  minio:
    # Image construite FROM SOURCE (config/minio/Dockerfile) : les pulls des
    # repos minio/* (docker.io/minio, quay.io/minio, bitnami/minio) sont
    # refusés par certains daemons ("pull access denied"), et dl.min.io ne
    # sert plus les binaires (HTTP 410). On compile le serveur MinIO officiel
    # depuis github.com/minio/minio — aucun pull d'image "minio" nécessaire.
    build: ./config/minio
    image: chu-minio:RELEASE.2025-10-15T17-29-55Z
    container_name: chu-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3 (S3A côté Spark/Hive, S3 natif côté Trino)
      - "9001:9001"   # console d'admin
    volumes:
      - minio-data:/data
    networks: [chu-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    # amazon/aws-cli (pull OK) à la place de minio/mc (pull bloqué) :
    # mêmes opérations S3 (création bucket + copie raw) via l'API AWS standard
    image: amazon/aws-cli:latest
    container_name: chu-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    # 1) copie fidèle de la zone d'atterrissage (noms de dossiers FR avec
    #    espaces conservés) dans raw/ ;
    # 2) référentiels livrés avec le projet (geo.api.gouv.fr + ESATIS 2020
    #    converti en CSV, voir config/data/referentiels/) -> raw/referentiels/ ;
    # 3) normalisation des chemins lus par Spark (clés minuscules sans espace,
    #    copies serveur S3 donc sans transit réseau par le conteneur).
    command:
      - >-
        aws --endpoint-url http://minio:9000 s3 mb s3://lake || true
        && aws --endpoint-url http://minio:9000 s3 cp /data/ s3://lake/raw/ --recursive
        && aws --endpoint-url http://minio:9000 s3 cp /referentiels/ s3://lake/raw/referentiels/ --recursive
        && aws --endpoint-url http://minio:9000 s3 cp "s3://lake/raw/DECES EN FRANCE/deces.csv" "s3://lake/raw/deces/deces.csv"
        && aws --endpoint-url http://minio:9000 s3 cp "s3://lake/raw/Etablissement de SANTE/etablissement_sante.csv" "s3://lake/raw/etablissement/etablissement_sante.csv"
        && aws --endpoint-url http://minio:9000 s3 cp "s3://lake/raw/Etablissement de SANTE/activite_professionnel_sante.csv" "s3://lake/raw/referentiels/activite_professionnel_sante.csv"
        && aws --endpoint-url http://minio:9000 s3 cp "s3://lake/raw/Hospitalisation/Hospitalisations.csv" "s3://lake/raw/hospitalisation/Hospitalisations.csv"
        && aws --endpoint-url http://minio:9000 s3 cp "s3://lake/raw/referentiels/ESATIS_2019.csv" "s3://lake/raw/satisfaction/ESATIS_2019.csv"
        && aws --endpoint-url http://minio:9000 s3 cp "s3://lake/raw/referentiels/ESATIS_2020.csv" "s3://lake/raw/satisfaction/ESATIS_2020.csv"
    volumes:
      # Zone d'atterrissage des sources brutes (lecture seule)
      - "../../DATA Projet:/data:ro"
      # Référentiels embarqués dans le livrable (voir config/data/referentiels/)
      - ./config/data/referentiels:/referentiels:ro
    networks: [chu-net]
    restart: "no"

  # --------------------------------------------------------------------------
  # INGESTION : copie des sources brutes vers la zone raw du lake.
  # Le service minio-init ci-dessus joue ce rôle (one-shot, restart: "no").
  # Les CSV sont ensuite lus directement depuis s3a://lake/raw/ par Spark.
  # --------------------------------------------------------------------------

  # --------------------------------------------------------------------------
  # CATALOGUE : Hive Metastore (métadonnées) + son SGBD PostgreSQL
  # --------------------------------------------------------------------------
  metastore-db:
    image: postgres:15
    container_name: chu-metastore-db
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    volumes:
      - metastore-db-data:/var/lib/postgresql/data
    networks: [chu-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 20

  hive-metastore-init:
    image: apache/hive:4.2.1
    container_name: chu-hive-metastore-init
    depends_on:
      metastore-db:
        condition: service_healthy
    environment:
      HIVE_CONF_DIR: /opt/hive/conf
    volumes:
      - ./config/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      # Driver JDBC PostgreSQL (absent de l'image Hive) : jar versionné dans
      # le livrable, monté en lecture seule (pas de téléchargement au démarrage)
      - ./config/hive/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar:ro
    # Initialise le schéma du metastore (idempotent : -initSchema échoue
    # proprement si le schéma existe déjà -> || true)
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/hive/bin/schematool -dbType postgres -initSchema || true
    networks: [chu-net]
    restart: "no"

  hive-metastore:
    image: apache/hive:4.2.1
    container_name: chu-hive-metastore
    depends_on:
      hive-metastore-init:
        condition: service_completed_successfully
    environment:
      HIVE_CONF_DIR: /opt/hive/conf
      SERVICE_NAME: metastore
      # Le schéma est initialisé par hive-metastore-init (one-shot) : IS_RESUME
      # demande à l'entrypoint de l'image de sauter son propre -initOrUpgradeSchema
      # (non idempotent sur un schéma déjà initialisé)
      IS_RESUME: "true"
    volumes:
      - ./config/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      # Driver JDBC PostgreSQL (métadonnées stockées dans metastore-db)
      - ./config/hive/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar:ro
      # Connecteur S3A : hadoop-aws + AWS SDK v2 (absents de l'image). Nécessaire
      # au metastore lui-même : le write-back des statistiques (ANALYZE Trino ->
      # updatePartitionStatsFast) liste les fichiers du lake via S3A. L'entrypoint
      # de l'image copie les jars montés sur /tmp/ext-jars vers /opt/hive/lib.
      - ./config/hive/ext-jars:/tmp/ext-jars:ro
      # Scripts DDL/vues montés pour le DAG lakehouse_init (beeline via docker exec)
      - .:/opt/scripts:ro
    # Le metastore stocke les MÉTADONNÉES (les données Parquet restent dans MinIO),
    # mais il doit pouvoir lister le S3 pour les stats (voir ext-jars ci-dessus).
    command: ["hive", "--service", "metastore"]
    ports:
      - "9083:9083"   # Thrift (Spark, Trino)
    networks: [chu-net]

  # HiveServer2 (HS2, port 10000) : interface JDBC/beeline utilisée par le DAG
  # lakehouse_init pour exécuter le DDL (01_ddl/*.sql) et créer les vues.
  # Service DÉDIÉ : l'entrypoint de l'image apache/hive démarre HS2 avec le
  # classpath Tez correct quand SERVICE_NAME=hiveserver2 (le service
  # `metastore` ci-dessus n'expose, lui, que le Thrift 9083).
  hive-hs2:
    image: apache/hive:4.2.1
    container_name: chu-hive-hs2
    depends_on:
      hive-metastore-init:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_started
    environment:
      HIVE_CONF_DIR: /opt/hive/conf
      SERVICE_NAME: hiveserver2
      # Schéma déjà initialisé par hive-metastore-init (one-shot) : IS_RESUME
      # demande à l'entrypoint de sauter son -initOrUpgradeSchema (non
      # idempotent sur un schéma déjà initialisé)
      IS_RESUME: "true"
    volumes:
      - ./config/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      # Driver JDBC PostgreSQL (métadonnées stockées dans metastore-db)
      - ./config/hive/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar:ro
      # Connecteur S3A : hadoop-aws + AWS SDK v2 2.24.6 (absents de l'image).
      # L'entrypoint de l'image copie les jars montés sur /tmp/ext-jars vers
      # /opt/hive/lib au démarrage ("dynamic jar loader" de l'image).
      - ./config/hive/ext-jars:/tmp/ext-jars:ro
      # Scripts DDL/vues montés pour le DAG lakehouse_init (beeline via docker exec)
      - .:/opt/scripts:ro
    ports:
      - "10000:10000" # Beeline (DAG lakehouse_init : DDL + vues)
    networks: [chu-net]
    healthcheck:
      # HS2 met ~60-90s à ouvrir son port Thrift
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/10000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  # --------------------------------------------------------------------------
  # SOURCES : S1 PostgreSQL (dump ChuSimulation) + conteneur benchmark DuckDB
  # --------------------------------------------------------------------------
  s1-postgres:
    image: postgres:15
    container_name: chu-s1-postgres
    environment:
      POSTGRES_USER: chu
      POSTGRES_PASSWORD: chu
      POSTGRES_DB: chu_s1
    volumes:
      - s1-data:/var/lib/postgresql/data
      - ./config/s1-postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - "../../DATA Projet/BDD PostgreSQL/DATA2023:/docker-entrypoint-initdb.d/DATA2023.dump:ro"
    ports:
      - "5432:5432"
    networks: [chu-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chu -d chu_s1"]
      interval: 5s
      timeout: 5s
      retries: 30

  bench-duckdb:
    build:
      context: ./04_benchmark
      dockerfile: Dockerfile.duckdb
    image: chu-bench-duckdb:latest
    container_name: chu-bench-duckdb
    volumes:
      # Sources brutes (montage fixe /data-projet, même convention que run-duckdb.sh)
      - "../../DATA Projet:/data-projet:ro"
      # Script DQ + résultats (écriture) + staging embarqué dans le livrable
      # (05_qualite/staging : CSV dérivés UTF-8 + référentiels, voir dq_checks.sql)
      - ./05_qualite:/opt/l2work/dq:ro
      - ./05_qualite/results:/opt/l2work/dq/results
      - ./05_qualite/staging:/opt/l2work/staging:ro
      # Résultats du harnais de benchmark (écriture, voir 04_benchmark)
      - ./04_benchmark/results:/opt/l2work/poc/results
    # Le conteneur reste disponible pour le benchmark (harness) et les
    # contrôles qualité exécutés par Airflow (docker exec chu-bench-duckdb)
    command: ["sleep", "infinity"]
    networks: [chu-net]

  # --------------------------------------------------------------------------
  # TRAITEMENT : Apache Spark (standalone : 1 master + 1 worker)
  # --------------------------------------------------------------------------
  # Image officielle apache/spark (l'org bitnami n'est pas publiquement
  # accessible depuis tous les environnements : manifest unknown).
  spark-master:
    # image custom = apache/spark:3.5.1 + jars S3A (hadoop-aws 3.3.4 + AWS SDK
    # v1) et JDBC PostgreSQL dans $SPARK_HOME/jars (voir config/spark/Dockerfile)
    build: ./config/spark
    image: chu-spark:3.5.1-s3a
    container_name: chu-spark-master
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    volumes:
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077"   # Spark master (soumission Airflow)
      - "8085:8080"   # Web UI du master (8080 hôte = Trino)
    networks: [chu-net]

  spark-worker:
    build: ./config/spark
    image: chu-spark:3.5.1-s3a
    container_name: chu-spark-worker
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 4g
      SPARK_WORKER_WEBUI_PORT: "8081"
    volumes:
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on: [spark-master]
    ports:
      - "8086:8081"   # Web UI du worker (8081 interne)
    networks: [chu-net]

  # --------------------------------------------------------------------------
  # REQUÊTAGE : Trino (connecteur Hive -> MinIO, pruning des partitions)
  # --------------------------------------------------------------------------
  trino:
    image: trinodb/trino:latest
    container_name: chu-trino
    depends_on:
      hive-metastore:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      # Plafond JVM explicite (sinon le launcher prend ~80 % de la RAM de la
      # VM Docker -> OOM-killer pendant les jobs Spark, exit 137)
      JAVA_OPTS: "-Xmx1500m"
    volumes:
      - ./config/trino/config.properties:/etc/trino/config.properties:ro
      - ./config/trino/catalog:/etc/trino/catalog:ro
      # Scripts montés pour le DAG lakehouse_init (trino-cli via docker exec)
      - .:/opt/scripts:ro
    # Limite cgroup : avec ce plafond, le tas JVM par defaut resterait sage
    mem_limit: 2g
    ports:
      - "8080:8080"
    networks: [chu-net]

  # --------------------------------------------------------------------------
  # VISUALISATION : Apache Superset (localhost:8088)
  # --------------------------------------------------------------------------
  superset-db:
    image: postgres:15
    container_name: chu-superset-db
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    networks: [chu-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 20

  superset:
    # Image du projet : image officielle + driver psycopg2 (absent de l'image
    # officielle, requis pour la base de métadonnées PostgreSQL superset-db)
    build:
      context: ./06_superset
      dockerfile: Dockerfile
    image: chu-superset:4.1.1
    container_name: chu-superset
    depends_on:
      superset-db:
        condition: service_healthy
      trino:
        condition: service_started
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: change-me-in-production-0123456789abcdef
      # Admin par défaut (à changer) : admin / admin
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      ADMIN_EMAIL: admin@chu.local
      ADMIN_FIRSTNAME: Admin
      ADMIN_LASTNAME: CHU
    volumes:
      - ./config/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    command:
      - /bin/bash
      - -c
      - superset db upgrade
        && superset fab create-admin --username $$ADMIN_USERNAME --firstname $$ADMIN_FIRSTNAME --lastname $$ADMIN_LASTNAME --email $$ADMIN_EMAIL --password $$ADMIN_PASSWORD || true
        && superset init
        && superset run -h 0.0.0.0 -p 8088
    ports:
      - "8088:8088"
    networks: [chu-net]

  # --------------------------------------------------------------------------
  # ORCHESTRATION : Apache Airflow (LocalExecutor, 1 scheduler + 1 webserver)
  # --------------------------------------------------------------------------
  airflow-db:
    image: postgres:15
    container_name: chu-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    networks: [chu-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot : initialise la base Airflow (migrate) + crée l'utilisateur admin.
  # Pattern officiel Airflow : le scheduler et le webserver en dépendent
  # (service_completed_successfully) -> plus de course au premier démarrage.
  airflow-init:
    image: chu-airflow:2.9.3
    container_name: chu-airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "UKMzEm3yIuFYHrpoiMOQc3wvXHkqYz8bumjZWmZTjNw="
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - airflow-logs:/opt/airflow/logs
    entrypoint: ["/bin/bash", "-c"]
    command:
      - airflow db migrate
        && airflow users create --role Admin --username admin --password admin --firstname Admin --lastname CHU --email admin@chu.local || true
    restart: "no"
    networks: [chu-net]

  airflow-scheduler:
    # Image du projet : image officielle + client Docker CLI (les DAGs pilotent
    # beeline/trino/duckdb via `docker exec`, socket monté ci-dessous)
    build:
      context: ./03_airflow
      dockerfile: Dockerfile
    image: chu-airflow:2.9.3
    container_name: chu-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "UKMzEm3yIuFYHrpoiMOQc3wvXHkqYz8bumjZWmZTjNw="
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "chu-l2-webserver-secret"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      # Provider Spark (SparkSubmitOperator) installé au BUILD de l'image
      # chu-airflow (03_airflow/Dockerfile) : pas de pip au démarrage
      # Connexion Spark standalone pour SparkSubmitOperator
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark%3A%2F%2Fspark-master%3A7077  # host URL-encodé : le hook Spark reconstruit master=host (sans schéma), donc on met l URL complète dans host
      SPARK_CONN_ID: spark_default
      SPARK_MASTER: spark://spark-master:7077
    volumes:
      - ./03_airflow/dags:/opt/airflow/dags
      - ./02_spark:/opt/spark/jobs
      - .:/opt/airflow/scripts
      - airflow-logs:/opt/airflow/logs
      # Socket Docker : permet au DAG dq_checks d'exécuter le conteneur DuckDB
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["scheduler"]
    networks: [chu-net]

  airflow-webserver:
    image: chu-airflow:2.9.3
    container_name: chu-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-scheduler:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "UKMzEm3yIuFYHrpoiMOQc3wvXHkqYz8bumjZWmZTjNw="
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "chu-l2-webserver-secret"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark%3A%2F%2Fspark-master%3A7077  # host URL-encodé : le hook Spark reconstruit master=host (sans schéma), donc on met l URL complète dans host
      SPARK_CONN_ID: spark_default
      SPARK_MASTER: spark://spark-master:7077
    volumes:
      - ./03_airflow/dags:/opt/airflow/dags
      - ./02_spark:/opt/spark/jobs
      - .:/opt/airflow/scripts
      - airflow-logs:/opt/airflow/logs
    # La base est initialisée par airflow-init (one-shot) : le webserver démarre
    # directement (plus de `db migrate` ici -> plus de course au 1er démarrage)
    command: ["airflow", "webserver", "--port", "8090"]
    ports:
      - "8090:8090"
    networks: [chu-net]
